plugins {
     id 'com.android.application'
     id 'org.jetbrains.kotlin.android'
}

// #150 - the three native-build tool locations below used to be hardcoded
// absolute paths, which meant the build only worked on one machine. They're
// resolved here at configure time instead.
//
// CMake wants forward slashes even on Windows, hence the normalization.
def toCMakePath = { path -> path.toString().replace('\\', '/') }

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

// Kept as a variable rather than read back off the android extension, since
// it's needed both by AGP (ndkVersion below) and to build the NDK toolchain
// path, and referencing the extension from inside its own closure is fragile.
def hypdroidNdkVersion = '30.0.15729638'

// local.properties' sdk.dir is Android's own standard, per-machine SDK
// pointer (and is gitignored). ANDROID_HOME/ANDROID_SDK_ROOT are the
// conventional fallbacks for CI or a shell-configured environment.
def resolvedSdkDir = localProps.getProperty('sdk.dir')
    ?: System.getenv('ANDROID_HOME')
    ?: System.getenv('ANDROID_SDK_ROOT')
if (resolvedSdkDir == null) {
    throw new GradleException(
        "Android SDK location not found. Set 'sdk.dir' in android/local.properties, " +
        "or set the ANDROID_HOME environment variable.")
}
def ndkToolchainFile = "${toCMakePath(resolvedSdkDir)}/ndk/${hypdroidNdkVersion}/build/cmake/android.toolchain.cmake"

// vcpkg lives at the repo root, one level above this Gradle project.
def vcpkgToolchainFile = "${toCMakePath(rootProject.file('../vcpkg').canonicalPath)}/scripts/buildsystems/vcpkg.cmake"

// Needed by vcpkg's own toolchain. Not on PATH in every environment, so it's
// overridable; see docs/ENVIRONMENT.md.
def pkgConfigExecutable = toCMakePath(localProps.getProperty('pkgconfig.exe') ?: 'pkg-config')

android {
    namespace = "org.libsdl.app"
    compileSdkVersion 35
    ndkVersion = hypdroidNdkVersion
    defaultConfig {
        // All Files Access (MANAGE_EXTERNAL_STORAGE, #27) is fundamentally
        // an API 30+ concept - bumped from the SDL template's default 21
        // since supporting older devices makes no sense for this project's
        // actual target hardware anyway. Native code's ANDROID_PLATFORM
        // (android-28, unchanged) stays lower than this and that's fine -
        // its assumed API surface is a guaranteed subset of API 30+.
        minSdkVersion 30
        targetSdkVersion 35
        // ExperimentalHS deliberately uses its own applicationId, NOT
        // Hypdroid's "com.hypdroid.app". This repo exists to attempt
        // invasive work (decode-path/NEON experiments) that could produce
        // a broken build - if it shared Hypdroid's package ID, installing
        // an experimental test build would silently overwrite the real
        // app's install on the same device. Distinct IDs let both sit
        // side by side on the test hardware.
        //
        // #1 - the ID is "com.exphs", not "com.hypdroid.experimental" as
        // it was originally. A hypdroid-prefixed ID read as though these
        // builds belonged to Hypdroid, which is the opposite of the point
        // of this repo. Note this was NOT an upgrade in place: the old ID
        // is a different app to Android, so an existing experimental
        // install had to be removed and storage access granted again.
        //
        // Inherited from Hypdroid's #147 and still true here: `namespace`
        // (above) and every source file's actual `package org.libsdl.app`
        // declaration are deliberately left alone. applicationId and
        // namespace are independent in Android, so a full source-tree
        // package rename would be churn with no visible effect.
        //
        // Version numbers deliberately track whatever mainline Hypdroid
        // this repo was last synced with (currently v5.0), so it's always
        // obvious which upstream baseline any experimental build sits on.
        applicationId "com.exphs"
        versionCode 5
        versionName "5.0"
        externalNativeBuild {
            cmake {
                // android-28 matches what Phase B's vcpkg triplet and the
                // manually-built libmpeg2 already target - kept consistent.
                //
                // AGP passes its own -DCMAKE_TOOLCHAIN_FILE (the NDK's
                // android.toolchain.cmake) before these arguments; ours
                // overrides it since vcpkg.cmake chain-loads the NDK
                // toolchain internally (VCPKG_CHAINLOAD_TOOLCHAIN_FILE) -
                // this is required so find_package() resolves against
                // vcpkg's arm64-android packages instead of failing outright.
                arguments "-DANDROID_PLATFORM=android-28",
                    "-DANDROID_STL=c++_static",
                    "-DCMAKE_TOOLCHAIN_FILE=${vcpkgToolchainFile}".toString(),
                    "-DVCPKG_TARGET_TRIPLET=arm64-android",
                    "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${ndkToolchainFile}".toString(),
                    "-DPKG_CONFIG_EXECUTABLE=${pkgConfigExecutable}".toString()
                // arm64-v8a only: Phase B's vcpkg dependencies were built
                // exclusively for the arm64-android triplet (matching the
                // real target hardware - Retroid Pocket 5 / SBCs), not
                // x86_64. An arm64-v8a emulator image is used for
                // on-device verification instead of x86_64.
                abiFilters 'arm64-v8a'
            }
        }
    }
    signingConfigs {
        release {
            // Reuses the same debug keystore every build has been signed
            // with since v1.0 - there's no separate release keystore.
            // Applying it here means assembleRelease alone produces a
            // signed, installable APK, with no manual apksigner step to
            // forget and no reason to ever build a "release" via the
            // debug build type again. See #129.
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // Separate package ID from release, so a debug/test build
            // installs alongside the real release install instead of
            // silently overwriting it (both share the same applicationId
            // otherwise, since AGP's default debug build type has no
            // suffix of its own).
            applicationIdSuffix ".debug"
        }
    }
    // Two flavors, same codebase, zero behavior differences right now -
    // just distinct names/package IDs so both can be installed side by
    // side. "handheld" ("Hypdroid Handheld") is the Retroid Pocket 5
    // target. "full" ("Hypdroid Touch") is the stock/OEM Android target.
    // Functional differences (All Files Access, touch controls) are a
    // deliberate later step, not part of this change.
    flavorDimensions += "access"
    productFlavors {
        handheld {
            dimension "access"
        }
        full {
            dimension "access"
            applicationIdSuffix ".full"
            versionNameSuffix "-full"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            cmake {
                // Points directly at hypseus's own CMakeLists.txt rather
                // than wrapping it via a jni/CMakeLists.txt add_subdirectory()
                // - hypseus's build uses CMAKE_SOURCE_DIR (the true top-level
                // project dir) internally (e.g. cmake/modules lookup), which
                // breaks under add_subdirectory() since that doesn't change
                // what CMAKE_SOURCE_DIR means. Pointing here directly keeps
                // hypseus as the actual top-level project, matching how it
                // was verified working in #19/#20.
                path '../../hypseus-singe/src/CMakeLists.txt'
            }
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Phase D: Settings/folder-browser/game-list screens (Kotlin + Compose).
    // The native hypseus game itself has no Compose dependency at all.
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Phase E: carousel dashboard box art (#44) - loads real PNGs from
    // arbitrary file paths under the user's picked media folder, which
    // nothing before this needed.
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // #83 - Touch controls overlay (Touch flavor). RadialGamePad is a plain
    // Android View (not Compose) added directly into HypseusActivity's own
    // SDLActivity-provided root layout - see TouchControls.kt.
    implementation 'com.github.swordfish90:radialgamepad:2.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
}
